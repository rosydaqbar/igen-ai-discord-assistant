skills:
- name: moderation.get_member_messages
  description: Get recent messages from a channel. Pass the path (e.g. /channels/123/messages?limit=50).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 100
  permissions:
    user:
    - ReadMessageHistory
    bot:
    - ReadMessageHistory
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    success_status:
    - 200
- name: moderation.delete_messages
  description: Bulk delete messages in a channel. Pass the path (e.g. /channels/123/messages/bulk-delete).
  input_schema:
    type: object
    required:
    - path
    - messageIds
    properties:
      path:
        type: string
      messageIds:
        type: array
        minItems: 2
        maxItems: 100
        items:
          type: string
      reason:
        type: string
  permissions:
    user:
    - ManageMessages
    bot:
    - ManageMessages
  safety:
    confirmation_required: false
  discord:
    method: POST
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      messages: '{{ messageIds }}'
    success_status:
    - 200
- name: moderation.delete_message
  description: Delete a single message. Pass the path (e.g. /channels/123/messages/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - ManageMessages
    bot:
    - ManageMessages
  safety:
    confirmation_required: false
  discord:
    method: DELETE
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    success_status:
    - 204
