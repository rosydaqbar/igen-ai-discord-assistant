skills:
- name: moderation.get_guild
  description: Get the Discord guild object. Pass the path (e.g. /guilds/123).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
  permissions:
    user:
    - ModerateMembers
    bot: []
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    success_status:
    - 200
- name: moderation.guild_audit_log
  description: Get the guild audit log. Pass the path (e.g. /guilds/123/audit-logs).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 100
      action_type:
        type: integer
      user_id:
        type: string
  permissions:
    user:
    - ViewAuditLog
    bot:
    - ViewAuditLog
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    query:
      limit: '{{ limit }}'
      action_type: '{{ action_type }}'
      user_id: '{{ user_id }}'
    success_status:
    - 200
- name: moderation.get_guild_member
  description: Get a specific guild member. Pass the path (e.g. /guilds/123/members/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
  permissions:
    user:
    - ModerateMembers
    bot: []
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    success_status:
    - 200
- name: moderation.get_guild_members
  description: Get a list of guild members. Pass the path (e.g. /guilds/123/members).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 1000
      after:
        type: string
  permissions:
    user:
    - ModerateMembers
    bot: []
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    query:
      limit: '{{ limit }}'
      after: '{{ after }}'
    success_status:
    - 200
- name: moderation.get_guild_roles
  description: Get all roles in the guild. Pass the path (e.g. /guilds/123/roles).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
  permissions:
    user:
    - ManageRoles
    bot: []
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    success_status:
    - 200
- name: moderation.get_guild_channels
  description: Get all channels in the guild. Pass the path (e.g. /guilds/123/channels).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
  permissions:
    user:
    - ManageChannels
    bot: []
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    success_status:
    - 200
