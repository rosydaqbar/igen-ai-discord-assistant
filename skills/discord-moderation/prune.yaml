skills:
- name: moderation.prune_members_preview
  description: Preview how many members would be pruned. Pass the path (e.g. /guilds/123/prune).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      days:
        type: integer
        minimum: 1
        maximum: 30
  permissions:
    user:
    - KickMembers
    bot:
    - KickMembers
  safety:
    confirmation_required: false
  discord:
    method: GET
    endpoint: '{{ path }}'
    query:
      days: '{{ days }}'
    success_status:
    - 200
- name: moderation.prune_members
  description: Prune (kick) inactive members. Pass the path (e.g. /guilds/123/prune).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      days:
        type: integer
        minimum: 1
        maximum: 30
      computeOnPruneCount:
        type: boolean
      reason:
        type: string
  permissions:
    user:
    - KickMembers
    bot:
    - KickMembers
  safety:
    confirmation_required: false
  discord:
    method: POST
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      days: '{{ days }}'
      compute_on_prune_count: '{{ computeOnPruneCount }}'
    success_status:
    - 200
