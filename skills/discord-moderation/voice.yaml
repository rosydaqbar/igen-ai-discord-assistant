- name: moderation.move_member
  description: Move a Discord member to a specific voice channel. Pass the path (e.g. /guilds/123/members/456) and channelId.
  input_schema:
    type: object
    required:
    - path
    - channelId
    properties:
      path:
        type: string
      channelId:
        type: string
      reason:
        type: string
  permissions:
    user:
    - MoveMembers
    bot:
    - MoveMembers
  safety:
