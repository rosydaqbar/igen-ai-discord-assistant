skills:
- name: moderation.deafen_member
  description: Deafen a Discord member in voice. Pass the path (e.g. /guilds/123/members/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - DeafenMembers
    bot:
    - DeafenMembers
  safety:
    hierarchy: target_member
    confirmation_required: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      deaf: true
    success_status:
    - 200
