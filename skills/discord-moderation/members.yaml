skills:
- name: moderation.timeout
  description: Timeout a Discord member for a duration in seconds. Pass the path (e.g. /guilds/123/members/456) and duration.
  input_schema:
    type: object
    required:
    - path
    - durationSeconds
    properties:
      path:
        type: string
      durationSeconds:
        type: integer
        minimum: 1
        maximum: 2419200
      reason:
        type: string
  permissions:
    user:
    - ModerateMembers
    bot:
    - ModerateMembers
  safety:
    hierarchy: target_member
    confirmation_required: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      communication_disabled_until: '{{ timeoutUntilIso(durationSeconds) }}'
    success_status:
    - 200
- name: moderation.remove_timeout
  description: Remove timeout from a Discord member. Pass the path (e.g. /guilds/123/members/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - ModerateMembers
    bot:
    - ModerateMembers
  safety:
    hierarchy: target_member
    confirmation_required: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      communication_disabled_until: null
    success_status:
    - 200
- name: moderation.kick
  description: Kick a Discord member. Pass the path (e.g. /guilds/123/members/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - KickMembers
    bot:
    - KickMembers
  safety:
    hierarchy: target_member
    confirmation_required: false
  discord:
    method: DELETE
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    success_status:
    - 204
- name: moderation.ban
  description: Ban a Discord member. Pass the path (e.g. /guilds/123/bans/456) and deleteMessageSeconds.
  input_schema:
    type: object
    required:
    - path
    - deleteMessageSeconds
    properties:
      path:
        type: string
      deleteMessageSeconds:
        type: integer
        minimum: 0
        maximum: 604800
      reason:
        type: string
  permissions:
    user:
    - BanMembers
    bot:
    - BanMembers
  safety:
    hierarchy: target_member
    confirmation_required: false
  discord:
    method: PUT
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      delete_message_seconds: '{{ deleteMessageSeconds }}'
    success_status:
    - 204
- name: moderation.unban
  description: Unban a Discord user. Pass the path (e.g. /guilds/123/bans/456).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - BanMembers
    bot:
    - BanMembers
  safety:
    confirmation_required: false
  discord:
    method: DELETE
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    success_status:
    - 204
