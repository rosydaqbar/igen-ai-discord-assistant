skills:
- name: moderation.create_role
  description: Create a Discord role. Pass the path (e.g. /guilds/123/roles) and role fields.
  input_schema:
    type: object
    required:
    - path
    - name
    - permissions
    - color
    - hoist
    - mentionable
    properties:
      path:
        type: string
      name:
        type: string
      permissions:
        type: string
      color:
        type: integer
        minimum: 0
        maximum: 16777215
      hoist:
        type: boolean
      mentionable:
        type: boolean
      reason:
        type: string
  permissions:
    user:
    - ManageRoles
    bot:
    - ManageRoles
  safety:
    confirmation_required: false
    dangerous_permissions_require_confirmation: false
  discord:
    method: POST
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      name: '{{ name }}'
      permissions: '{{ permissions }}'
      color: '{{ color }}'
      hoist: '{{ hoist }}'
      mentionable: '{{ mentionable }}'
    success_status:
    - 200
- name: moderation.edit_role
  description: Edit a Discord role. Pass the path (e.g. /guilds/123/roles/456) and final role fields.
  input_schema:
    type: object
    required:
    - path
    - name
    - permissions
    - color
    - hoist
    - mentionable
    properties:
      path:
        type: string
      name:
        type: string
      permissions:
        type: string
      color:
        type: integer
        minimum: 0
        maximum: 16777215
      hoist:
        type: boolean
      mentionable:
        type: boolean
      reason:
        type: string
  permissions:
    user:
    - ManageRoles
    bot:
    - ManageRoles
  safety:
    hierarchy: target_role
    confirmation_required: false
    dangerous_permissions_require_confirmation: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      name: '{{ name }}'
      permissions: '{{ permissions }}'
      color: '{{ color }}'
      hoist: '{{ hoist }}'
      mentionable: '{{ mentionable }}'
    success_status:
    - 200
- name: moderation.set_role_permissions
  description: Set a Discord role's full permissions bitfield. Pass the path (e.g. /guilds/123/roles/456).
  input_schema:
    type: object
    required:
    - path
    - permissions
    properties:
      path:
        type: string
      permissions:
        type: string
      reason:
        type: string
  permissions:
    user:
    - ManageRoles
    bot:
    - ManageRoles
  safety:
    hierarchy: target_role
    confirmation_required: false
    dangerous_permissions_require_confirmation: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      permissions: '{{ permissions }}'
    success_status:
    - 200
- name: moderation.delete_role
  description: Delete a Discord role. Pass the path (e.g. /guilds/123/roles/456).
  input_schema:
    type: object
    required:
    - path
    properties:
