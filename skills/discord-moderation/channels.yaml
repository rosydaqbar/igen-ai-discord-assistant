skills:
- name: moderation.create_channel
  description: Create a guild channel. Pass the path (e.g. /guilds/123/channels) and channel fields.
  input_schema:
    type: object
    required:
    - path
    - name
    - type
    properties:
      path:
        type: string
      name:
        type: string
      type:
        type: integer
        minimum: 0
      parentId:
        type: string
      topic:
        type: string
      nsfw:
        type: boolean
      rateLimitPerUser:
        type: integer
        minimum: 0
        maximum: 21600
      reason:
        type: string
  permissions:
    user:
    - ManageChannels
    bot:
    - ManageChannels
  safety:
    confirmation_required: false
  discord:
    method: POST
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      name: '{{ name }}'
      type: '{{ type }}'
      parent_id: '{{ parentId }}'
      topic: '{{ topic }}'
      nsfw: '{{ nsfw }}'
      rate_limit_per_user: '{{ rateLimitPerUser }}'
    success_status:
    - 201
- name: moderation.edit_channel
  description: Edit a Discord channel. Pass the path (e.g. /channels/123) and final fields.
  input_schema:
    type: object
    required:
    - path
    - name
    properties:
      path:
        type: string
      name:
        type: string
      topic:
        type: string
      nsfw:
        type: boolean
      rateLimitPerUser:
        type: integer
        minimum: 0
        maximum: 21600
      parentId:
        type: string
      reason:
        type: string
  permissions:
    user:
    - ManageChannels
    bot:
    - ManageChannels
  safety:
    confirmation_required: false
  discord:
    method: PATCH
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    body:
      name: '{{ name }}'
      topic: '{{ topic }}'
      nsfw: '{{ nsfw }}'
      rate_limit_per_user: '{{ rateLimitPerUser }}'
      parent_id: '{{ parentId }}'
    success_status:
    - 200
- name: moderation.delete_channel
  description: Delete a Discord channel. Pass the path (e.g. /channels/123).
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      reason:
        type: string
  permissions:
    user:
    - ManageChannels
    bot:
    - ManageChannels
  safety:
    confirmation_required: false
  discord:
    method: DELETE
    endpoint: '{{ path }}'
    audit_log_reason: '{{ reason }}'
    success_status:
    - 200
